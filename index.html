  ctx.bezierCurveTo(h - 10, 31, h + 6, 8, h + 19, -13);
  ctx.bezierCurveTo(h - 8, -2, -h + 2, -2, -h - 15, -12);
  ctx.closePath();
}

function shipWake(ctx, o) {
  const { half: h, time: t } = o;
  shipEllipse(ctx, 0, 47, h + 31, 11, '#163d50a6');
  shipEllipse(ctx, 0, 51, h + 16, 4, '#0e35453b');
  // Soft, broken crescents are deliberately quieter than the moving ice.
  for (let i = 0; i < 3; i++) {
    const phase = Math.sin(t * .0008 + i * 1.9) * 2;
    shipCurve(ctx, [-h - 31 + phase, 42 + i * 8, -h * .55, 57 + i * 5,
      h * .5, 56 + i * 5, h + 30 - phase, 40 + i * 8],
    ['#bddfd54a', '#91d7d650', '#8bcdc12d'][i], 1.6 - i * .25);
  }
  for (const side of [-1, 1]) {
    shipCurve(ctx, [side * (h - 3), 35, side * (h + 10), 38,
      side * (h + 19), 38, side * (h + 30), 34], '#d8eee088', 1.6);
    shipEllipse(ctx, side * (h + 23), 39, 3, 1, '#e2efe177');
  }
}

function shipOars(ctx, o) {
  const count = Math.max(2, Math.min(5, Math.round(o.width / 69)));
  for (let i = 0; i < count; i++) {
    const x = (i - (count - 1) / 2) * Math.min(53, (o.width - 50) / count);
    ctx.save(); ctx.translate(x, 15);
    ctx.rotate(-.46 + Math.sin(o.time * .0009 + i * .7) * .018);
    // Blades disappear below the dark hull and return over the water.
    shipStroke(ctx, [[0, -5], [0, 43]], '#223e47', 6);
    shipStroke(ctx, [[-.6, -5], [-.6, 43]], '#c89961', 3);
    shipPolygon(ctx, [[-2, 35], [-5, 45], [-5, 53], [0, 57], [5, 53], [4, 43], [2, 35]],
      '#d9b67b', '#5f6656', 1.1);
    shipPolygon(ctx, [[-4, 44], [-4, 51], [0, 54], [4, 51], [3, 44]], '#4e8480');
    shipStroke(ctx, [[0, 37], [0, 51]], '#f0c98b99', 1);
    ctx.restore();
  }
}

function shipRigging(ctx, o) {
  const h = o.half, m = -h + 31, top = -91;
  // Stern-set, low rig: the central rescue corridor remains completely open.
  shipCurve(ctx, [m, top + 5, m - 5, -53, -h - 6, -37, -h + 5, -4], '#152f3d', 3);
  shipCurve(ctx, [m, top + 5, m - 5, -53, -h - 6, -37, -h + 5, -4], '#b9ac82', 1.1);
  shipCurve(ctx, [m, top + 8, m + 7, -48, m + 22, -34, m + 25, -3], '#173745', 2.8);
  shipCurve(ctx, [m, top + 8, m + 7, -48, m + 22, -34, m + 25, -3], '#c4b38b', 1);
  shipStroke(ctx, [[m, 3], [m, top]], '#3f3a35', 7);
  shipStroke(ctx, [[m - 1, 2], [m - 1, top]], '#b87e4e', 4);
  shipStroke(ctx, [[m - 2, -2], [m - 2, top + 3]], '#e0ac69', 1);
  for (const y of [-12, -16, -20, -74, -77])
    shipStroke(ctx, [[m - 4, y], [m + 3, y + 1]], '#dac597', 1.4);

  const flutter = Math.sin(o.time * .0013) * 2;
  shipPolygon(ctx, [[m + 2, top + 1], [m + 26, top + 3 + flutter],
    [m + 19, top + 9 + flutter], [m + 25, top + 14 + flutter], [m + 2, top + 11]],
  '#b75648', '#e5b36b', 1);
  shipStroke(ctx, [[m + 7, top + 5], [m + 12, top + 7], [m + 7, top + 9]], '#f0cf92', 1);

  ctx.save(); ctx.translate(m, -66);
  ctx.rotate(Math.sin(o.time * .00075) * .012);
  if (o.sail === 'raised') {
    // Optional wider display sail, for hero art rather than the puzzle board.
    shipPolygon(ctx, [[-24, -9], [27, -9], [31, 30], [0, 35], [-29, 30]], '#e4d9b5', '#706e5a', 1.3);
    for (const x of [-15, 9])
      shipPolygon(ctx, [[x, -8], [x + 10, -8], [x + 12, 31], [x + 1, 33]], '#6c9992');
    shipCurve(ctx, [-27, 27, -10, 31, 13, 32, 29, 27], '#fff2cf66', 1);
  } else {
    // Stowed square sail: three rounded folds and clearly readable bindings.
    ctx.beginPath(); ctx.moveTo(-24, -4);
    ctx.quadraticCurveTo(-28, 5, -22, 10);
    ctx.bezierCurveTo(-7, 14, 10, 14, 25, 9);
    ctx.quadraticCurveTo(31, 4, 26, -3); ctx.closePath();
    const cloth = ctx.createLinearGradient(0, -4, 0, 13);
    cloth.addColorStop(0, '#f1e5c5'); cloth.addColorStop(.5, '#d7d2ad'); cloth.addColorStop(1, '#9baf9e');
    ctx.fillStyle = cloth; ctx.fill(); ctx.strokeStyle = '#4c696a'; ctx.lineWidth = 1.3; ctx.stroke();
    for (const x of [-14, 8])
      shipPolygon(ctx, [[x, -3], [x + 8, -3], [x + 8, 11], [x, 11]], '#638e87');
    shipCurve(ctx, [-23, 5, -7, 9, 12, 10, 26, 4], '#fff1cf99', 1);
    for (const x of [-20, 0, 22]) {
      shipCurve(ctx, [x, -5, x - 3, 1, x - 3, 8, x, 13], '#766b51', 2);
      shipCurve(ctx, [x + 1, -5, x - 1, 1, x - 1, 8, x + 1, 12], '#e7c99a', .8);
    }
  }
  shipStroke(ctx, [[-30, -6], [32, -6]], '#493f36', 5);
  shipStroke(ctx, [[-29, -7], [31, -7]], '#cf9c62', 2);
  ctx.restore();
}

function shipStern(ctx, h) {
  ctx.beginPath(); ctx.moveTo(-h + 19, 16);
  ctx.bezierCurveTo(-h - 7, 8, -h - 30, -25, -h - 18, -43);
  ctx.bezierCurveTo(-h - 9, -55, -h + 10, -42, -h - 2, -31);
  ctx.bezierCurveTo(-h + 4, -46, -h - 15, -44, -h - 12, -31);
  ctx.bezierCurveTo(-h - 9, -18, -h + 6, -5, -h + 24, 4);
  ctx.closePath(); ctx.fillStyle = '#9b6547'; ctx.fill();
  ctx.strokeStyle = '#d1a16b'; ctx.lineWidth = 2; ctx.stroke();
  shipCurve(ctx, [-h + 13, 5, -h - 4, -5, -h - 19, -27, -h - 14, -37], '#4b544b', 3);
  shipCurve(ctx, [-h + 13, 5, -h - 4, -5, -h - 19, -27, -h - 14, -37], '#e6b977', .8);
}

function shipHull(ctx, o) {
  const h = o.half;
  const wood = ctx.createLinearGradient(0, -7, 0, 49);
  wood.addColorStop(0, '#c58c58'); wood.addColorStop(.32, '#a66c47');
  wood.addColorStop(.76, '#704b3f'); wood.addColorStop(1, '#3c3e3c');
  shipHullPath(ctx, h); ctx.fillStyle = wood; ctx.fill();
  ctx.save(); ctx.clip();
  for (let i = 0; i < 5; i++) {
    const y = 7 + i * 8;
    shipCurve(ctx, [-h - 18, y - 20, -h * .56, y + 7, h * .55, y + 7, h + 20, y - 21],
      i % 2 ? '#dd9a5c3b' : '#342e303b', 6.5);
    shipCurve(ctx, [-h - 18, y - 15, -h * .56, y + 10, h * .55, y + 10, h + 20, y - 16], '#3f3a34b3', 1.5);
    shipCurve(ctx, [-h - 18, y - 13.5, -h * .56, y + 11.5, h * .55, y + 11.5, h + 20, y - 14.5], '#e8aa6870', .7);
  }
  // A handful of carved wood-grain lines, not random flickering noise.
  for (let i = 0; i < 7; i++) {
    const x = -h + 20 + i * (o.width - 40) / 6, y = 21 + (i % 3) * 7;
    shipCurve(ctx, [x - 9, y, x - 3, y - 2, x + 4, y + 1, x + 11, y], '#f0b07133', .7);
    shipEllipse(ctx, x, y + 4, .9, .8, '#392f2f88');
  }
  // Raised clinker ribs and iron fastenings catch a thin warm edge light.
  for (let x = -h + 31; x < h - 20; x += 37) {
    shipCurve(ctx, [x, 5, x - 3, 19, x - 1, 29, x + 7, 42], '#3d39369c', 3);
    shipCurve(ctx, [x + 1.3, 5, x - 1.7, 19, x + .3, 29, x + 8.3, 42], '#c98a585c', .8);
    shipEllipse(ctx, x + 4, 35, 1.2, 1.2, '#b4a381');
  }
  ctx.restore();
  shipHullPath(ctx, h); ctx.strokeStyle = '#243c40'; ctx.lineWidth = 2.2; ctx.stroke();

  // Open deck: rear rail, planking, and cross-benches remain behind the crew.
  ctx.beginPath(); ctx.moveTo(-h + 1, -5);
  ctx.bezierCurveTo(-h * .55, -10, h * .55, -10, h + 1, -5);
  ctx.lineTo(h - 10, 8); ctx.quadraticCurveTo(0, 18, -h + 10, 8); ctx.closePath();
  ctx.fillStyle = '#3b504b'; ctx.fill();
  ctx.beginPath(); ctx.moveTo(-h + 7, -3);
  ctx.quadraticCurveTo(0, -8, h - 7, -3);
  ctx.lineTo(h - 18, 5); ctx.quadraticCurveTo(0, 12, -h + 18, 5); ctx.closePath();
  ctx.fillStyle = '#b19364'; ctx.fill();
  for (let x = -h + 20; x < h - 15; x += 15)
    shipStroke(ctx, [[x, -4], [x - 2, 6]], '#665d46', .8);
  shipCurve(ctx, [-h + 1, -5, -h * .5, -10, h * .5, -10, h + 1, -5], '#263d3e', 5.5);
  shipCurve(ctx, [-h + 1, -6, -h * .5, -11, h * .5, -11, h + 1, -6], '#d5ac70', 2);
  for (let x = -h + 32; x < h - 22; x += 43)
    shipStroke(ctx, [[x, -3], [x - 1, 7]], '#d2ab70', 4);
}

function shipShield(ctx, x, y, radius, index) {
  ctx.save(); ctx.translate(x, y); ctx.rotate((index % 2 ? -1 : 1) * .13);
  shipEllipse(ctx, 1.5, 2, radius + 1, radius + 1, '#203f425e');
  const metal = ctx.createLinearGradient(-radius, -radius, radius, radius);
  metal.addColorStop(0, '#e5cf98'); metal.addColorStop(.45, '#9aa78f'); metal.addColorStop(1, '#506d69');
  shipEllipse(ctx, 0, 0, radius, radius, '#233f42');
  shipEllipse(ctx, 0, 0, radius - 1, radius - 1, metal);
  shipEllipse(ctx, 0, 0, radius - 2.6, radius - 2.6, '#e5d2a2');
  const colors = ['#467d79', '#ad5d48', '#567c90'];
  const color = colors[index % colors.length];
  ctx.save(); ctx.beginPath(); ctx.arc(0, 0, radius - 2.6, 0, SHIP_TAU); ctx.clip();
  if (index % 2) {
    shipPolygon(ctx, [[-radius, -radius], [radius, -radius], [-radius, radius]], color);
    shipPolygon(ctx, [[2, -radius], [5, -radius], [-radius, 5], [-radius, 2]], '#f5dfad99');
  } else {
    ctx.fillStyle = color; ctx.fillRect(-radius, -radius, radius, radius); ctx.fillRect(0, 0, radius, radius);
  }
  shipStroke(ctx, [[-radius, 0], [radius, 0]], '#293f433b', .8);
  shipStroke(ctx, [[0, -radius], [0, radius]], '#293f433b', .8);
  ctx.restore();
  for (let i = 0; i < 8; i++) {
    const a = i * Math.PI / 4;
    shipEllipse(ctx, Math.cos(a) * (radius - 1.7), Math.sin(a) * (radius - 1.7), .65, .65, '#fff0bd');
  }
  shipEllipse(ctx, .3, .5, 3.8, 3.8, '#3b5659');
  shipEllipse(ctx, 0, 0, 2.9, 2.9, metal);
  shipEllipse(ctx, -.9, -1, .9, .8, '#fff1c7');
  ctx.restore();
}

function shipDragon(ctx, h) {
  // One continuous carved neck emerges from the prow, with a copper throat.
  ctx.beginPath(); ctx.moveTo(h - 23, 26);
  ctx.bezierCurveTo(h + 2, 9, h + 14, -8, h + 8, -29);
  ctx.bezierCurveTo(h + 4, -43, h + 10, -54, h + 23, -54);
  ctx.lineTo(h + 29, -49); ctx.lineTo(h + 40, -46); ctx.lineTo(h + 45, -37);
  ctx.lineTo(h + 30, -35); ctx.lineTo(h + 24, -39);
  ctx.bezierCurveTo(h + 16, -35, h + 22, -22, h + 20, -11);
  ctx.bezierCurveTo(h + 18, 6, h + 3, 25, h - 15, 34);
  ctx.closePath();
  const dragon = ctx.createLinearGradient(h - 10, 0, h + 31, -25);
  dragon.addColorStop(0, '#8a593e'); dragon.addColorStop(.5, '#bf8750'); dragon.addColorStop(1, '#dfa564');
  ctx.fillStyle = dragon; ctx.fill(); ctx.strokeStyle = '#293f40'; ctx.lineWidth = 2.5; ctx.stroke();
  // Antler-like crown and amber eye keep the small silhouette legible.
  shipPolygon(ctx, [[h + 12, -50], [h + 8, -66], [h + 18, -57], [h + 20, -49]], '#ba8a55', '#2c4241', 1.4);
  shipPolygon(ctx, [[h + 21, -51], [h + 25, -64], [h + 28, -50]], '#e0b474', '#314442', 1.2);
  shipCurve(ctx, [h - 15, 25, h + 10, 8, h + 17, -7, h + 12, -28], '#e7b875', 2.3);
  shipCurve(ctx, [h - 10, 25, h + 14, 8, h + 21, -7, h + 16, -28], '#5d654a', 2.2);
  shipCurve(ctx, [h - 5, 21, h + 4, 12, h + 3, 7, h + 8, 3], '#e8bc7a', 1);
  for (let i = 0; i < 4; i++) {
    const yy = -25 + i * 9, xx = h + 14 - i * 1.1;
    shipStroke(ctx, [[xx - 5, yy], [xx + 4, yy + 4], [xx - 3, yy + 7]], '#815a3e', 1.2);
  }
  shipStroke(ctx, [[h + 18, -47], [h + 29, -45]], '#5d513a', 2.8);
  shipEllipse(ctx, h + 25, -44, 2.8, 2.5, '#263d3d');
  shipEllipse(ctx, h + 25.7, -44.6, 1.1, 1.1, '#ffe0a0');
  shipStroke(ctx, [[h + 29, -38], [h + 40, -39]], '#775b3c', 1.4);
  shipEllipse(ctx, h + 38, -42, .8, .8, '#485047');
  shipPolygon(ctx, [[h + 31, -36], [h + 33, -32], [h + 35, -36]], '#f2d69a');
  // Bronze binding at the root of the figurehead.
  shipStroke(ctx, [[h + 2, 6], [h + 13, 10]], '#394e46', 5);
  shipStroke(ctx, [[h + 2, 5], [h + 13, 9]], '#d5b575', 2.4);
  shipEllipse(ctx, h + 7, 7, 1, 1, '#f2dca5');
}

function shipLantern(ctx, o) {
  const x = o.half - 17, sway = Math.sin(o.time * .0011) * .03;
  shipStroke(ctx, [[x - 4, -1], [x - 5, -38], [x - 14, -43], [x - 22, -38]], '#263f40', 3.5);
  shipStroke(ctx, [[x - 5, -2], [x - 6, -38], [x - 14, -42], [x - 21, -38]], '#b49d69', 1);
  ctx.save(); ctx.translate(x - 21, -38); ctx.rotate(sway);
  shipStroke(ctx, [[0, 0], [0, 6]], '#d6bd87', 1.4);
  shipPolygon(ctx, [[-6, 8], [-4, 21], [4, 21], [6, 8]], '#f4c372', '#443f32', 1.5);
  shipEllipse(ctx, 0, 14, 2.3, 4.4, '#fff5bf');
  shipStroke(ctx, [[-3, 9], [-3, 20]], '#a87846', 1);
  shipStroke(ctx, [[3, 9], [3, 20]], '#a87846', 1);
  shipPolygon(ctx, [[-7, 8], [0, 3], [7, 8]], '#5b6c58', '#303f39', 1);
  shipStroke(ctx, [[-5, 22], [5, 22]], '#d8aa68', 2);
  ctx.restore();
}

function drawLongshipBack(ctx, options = {}) {
  const o = shipOptions(options);
  ctx.save(); ctx.translate(o.x, o.y); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  shipWake(ctx, o); shipOars(ctx, o); shipRigging(ctx, o); shipStern(ctx, o.half); shipHull(ctx, o);
  // Warm light is behind faces and cargo, never a solid overlay on the puzzle.
  const lx = o.half - 38, pulse = .9 + Math.sin(o.time * .003) * .05;
  const glow = ctx.createRadialGradient(lx, -22, 1, lx, -22, 43);
  glow.addColorStop(0, `rgba(255, 213, 132, ${.17 * pulse})`); glow.addColorStop(1, 'rgba(255, 213, 132, 0)');
  ctx.fillStyle = glow; ctx.fillRect(lx - 44, -67, 88, 88);
  ctx.restore();
}

function shipCaptain(ctx, o) {
  const cx = o.x - o.half + 24, cy = o.y - 19;
  // The welcoming captain waves. Ice melts unaided; there is no hammer prop.
  o.drawViking(cx, cy, 0, 0, true, .76, 0, 1,
    {pose:o.success>0?'celebrate':'idle',celebration:3,time:o.time});
  ctx.save(); ctx.translate(cx, o.y);
  shipPolygon(ctx, [[-10, -24], [-17, -13], [-17, 1], [-10, -1], [-7, -17]], '#477a76', '#2b4e50', 1);
  shipStroke(ctx, [[-11, -31], [11, -31]], '#d5b374', 2.8);
  shipPolygon(ctx, [[0, -36], [3, -32], [0, -28], [-3, -32]], '#f3d397');
  ctx.restore();
}

function drawLongshipCrew(ctx, options = {}) {
  const o = shipOptions(options);
  if (typeof o.drawViking !== 'function') return;
  const captain = o.captain !== false;
  const count = o.rescued.length, available = Math.max(30, o.width - (captain ? 96 : 67));
  const spacing = Math.min(35, available / Math.max(1, count - 1));
  const scale = Math.min(.67, available / Math.max(48, count * 34));
  ctx.save();
  if (captain) shipCaptain(ctx, o);
  o.rescued.forEach((v, i) => {
    const phase = o.time * .0008 + i * 2.1;
    // Real arrivals retain their exact landing point. Hero/example crew alone
    // use an arranged composition; gameplay never snaps a Viking to a slot.
    const hasLanding=Number.isFinite(v.x)&&Number.isFinite(v.y);
    const x=hasLanding?v.x:o.x+12+(i-(count-1)/2)*spacing;
    const y=hasLanding?v.y:o.y-25*scale;
    o.drawViking(x,y,v.look||0,0,true,hasLanding?(v.scale||1):scale,
      0,1,{pose:v.pose||'idle',phase:v.phase||0,time:o.time,celebration:v.celebration??v.id??i});
  });
  ctx.restore();
}

function drawLongshipFront(ctx, options = {}) {
  const o = shipOptions(options), h = o.half;
  ctx.save(); ctx.translate(o.x, o.y); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  // The near gunwale hides boots, while the faces remain above it.
  shipCurve(ctx, [-h - 2, -1, -h * .55, 14, h * .55, 14, h + 2, -1], '#283f3e', 8);
  shipCurve(ctx, [-h - 2, -3, -h * .55, 11, h * .55, 11, h + 2, -3], '#be8d54', 5.5);
  shipCurve(ctx, [-h - 2, -4, -h * .55, 10, h * .55, 10, h + 2, -4], '#efd094', 1.4);
  // Evenly-spaced shield stations adapt to every campaign boat width.
  const count = Math.max(3, Math.min(9, Math.floor((o.width - 27) / 29)));
  const span = Math.max(35, o.width - 50), radius = Math.min(11.5, span / count * .4);
  for (let i = 0; i < count; i++) {
    const x = count === 1 ? 0 : -span / 2 + i * span / (count - 1);
    const y = 19 - Math.pow(x / h, 2) * 5;
    shipStroke(ctx, [[x, y - radius - 3], [x, y - radius + 2]], '#d2b380', 2);
    shipShield(ctx, x, y, radius, i);
  }
  shipDragon(ctx, h); shipLantern(ctx, o);
  const success = Math.max(0, Math.min(1, Number(o.success) || 0));
  if (success) {
    ctx.globalAlpha *= success * .6;
    shipCurve(ctx, [-h + 8, -4, -h * .4, 9, h * .5, 8, h + 4, -5], '#ffe9ad', 2.1);
    ctx.globalAlpha /= success * .6;
  }
  // A faint reflection belongs in front of the hull, below the landing surface.
  shipCurve(ctx, [-h + 31, 47, -h * .3, 52, h * .3, 52, h - 31, 47], '#a6dcd253', 1.4);
  ctx.restore();
}

function drawLongship(ctx, options = {}) {
  drawLongshipBack(ctx, options);
  drawLongshipCrew(ctx, options);
  drawLongshipFront(ctx, options);
}


// viking-art.js
// Original articulated crew artwork. Visual poses never change physics bodies.
// time is milliseconds, gait is radians, phase is 0..1 for impact/rise/sink.
// look modulo 4: man, woman, cow, pig. Higher values vary celebration style.
// The body stays within x +/-30, y -40..+27 at scale 1. The raised cheer axe
// extends that pose only to x +/-35, y -48, clear of neighboring crew.
// Water poses clip at local y=7: put (x,y+7) on the water surface.
const VIKING_TAU = Math.PI * 2;
const VIKING_PALETTES = [
  {hair:'#a85c35', light:'#d78c53', coat:'#bd6045', trim:'#e9c38d'},
  {hair:'#b18338', light:'#e1b45f', coat:'#3e827d', trim:'#e4cda0'},
  {hair:'#584239', light:'#96705a', coat:'#99714f', trim:'#d7c29b'},
  {hair:'#aa654c', light:'#d69a71', coat:'#70699b', trim:'#e5c69c'},
];
const vikingClamp = (value,low,high) => Math.max(low,Math.min(high,value));
const vikingLerp = (a,b,t) => a+(b-a)*t;
const vikingSmooth = value => {const t=vikingClamp(value,0,1);return t*t*(3-2*t);};
function vikingShape(ctx,points,fill,stroke='#243d4b',width=1.25) {
  ctx.beginPath();
  points.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));
  ctx.closePath();
  if(fill){ctx.fillStyle=fill;ctx.fill();}
  if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=width;ctx.stroke();}
}
function vikingLine(ctx,points,color,width=1.3) {
  ctx.beginPath();points.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));
  ctx.strokeStyle=color;ctx.lineWidth=width;ctx.stroke();
}
function vikingOval(ctx,x,y,rx,ry,color,angle=0) {
  ctx.beginPath();ctx.ellipse(x,y,rx,ry,angle,0,VIKING_TAU);ctx.fillStyle=color;ctx.fill();
}
function vikingLimb(ctx,shoulder,elbow,hand,palette,front=true) {
  // Two articulated segments make the action readable at normal play size.
  vikingLine(ctx,[shoulder,elbow,hand],'#253d48',8);
  vikingLine(ctx,[shoulder,elbow,hand],front?palette.coat:'#45616a',5.4);
  const angle=Math.atan2(hand[1]-elbow[1],hand[0]-elbow[0]);
  const cuff=[hand[0]-Math.cos(angle)*3.4,hand[1]-Math.sin(angle)*3.4];

function vikingHead(ctx,palette,state) {
  const {pose,t,still,face,beard,helmet}=state;
  // Head is deliberately angular, with a brow and cheek planes rather than a
  // rounded mascot face. All crews share a silhouette but have individual colors.
  ctx.save();ctx.translate(0,-10);ctx.rotate(state.headTilt);
  vikingOval(ctx,-12.8,1.3,3.1,4.4,'#d59b78');
  vikingOval(ctx,12.8,1.3,3.1,4.4,'#e8b08a');
  vikingShape(ctx,[[-11.7,-10],[-4,-14],[7,-12],[12,-7],[12,4],[8.5,10],
    [0,13],[-9,8],[-12,2]],'#eabd93','#72594b',1);
  vikingShape(ctx,[[-11,-6],[-6,-8],[-6,4],[-1,9],[-8.5,7],[-11,2]],'#d9a480',null);
  vikingOval(ctx,8,2,3.2,2,'#cf846d');

  // Women wear two long bound hair braids; men have a braided beard.
  if(state.species===1){
    for(const side of [-1,1]){
      ctx.save();ctx.scale(side,1);ctx.rotate(beard*.6);
      vikingShape(ctx,[[10,-12],[16,-6],[17,8],[19,18],[14,22],[11,16],[12,7],[9,-2]],palette.hair,'#654a3c',1);
      for(let yy=1;yy<18;yy+=5)vikingLine(ctx,[[12,yy],[16,yy+3],[13,yy+5]],palette.light,2);
      vikingLine(ctx,[[13,17],[18,17]],'#e3bf77',2.5);ctx.restore();
    }
  }else{
  // Beard pivots a little behind the head/torso, including two bound braids.
  ctx.save();ctx.translate(0,6);ctx.rotate(beard);
  vikingShape(ctx,[[-12,-5],[-9,1],[-4,4],[2,4],[8,0],[12,-5],[12,7],
    [8,15],[4,17],[1,13],[-3,18],[-8,13],[-12,6]],palette.hair,'#654a3c',1.05);
  vikingShape(ctx,[[-8,2],[-4,5],[-4,13],[-7,10]],palette.light,null);
  vikingShape(ctx,[[4,4],[8,2],[7,12],[4,14]],palette.light,null);
  vikingLine(ctx,[[-4.5,7],[-2.5,10],[-5.5,12],[-3.5,15]],'#724d37',1);
  vikingLine(ctx,[[6,5],[4,8],[7,10],[4.5,12]],'#724d37',1);
  vikingLine(ctx,[[-6.3,13],[-2.4,14]],'#d9b96e',2.2);
  vikingLine(ctx,[[3.8,12.5],[7.1,11.5]],'#d9b96e',2.2);
  ctx.restore();
  }

  const cycle=((t+state.seed*157)%4200+4200)%4200;
  const blink=!still&&(cycle>3600&&cycle<3700||cycle>3840&&cycle<3910);
  const eyesClosed=blink||pose==='impact'&&state.phase<.6||pose==='sink'&&state.phase>.86;
  const eyeY=-2.6;
  for(const side of [-1,1]){
    const ex=side*5.2;
    if(eyesClosed)vikingLine(ctx,[[ex-1.7,eyeY],[ex+1.7,eyeY+.2]],'#233a43',1.4);
    else{
      vikingOval(ctx,ex,eyeY,2.4,2.25,'#f5e6cf');
      vikingOval(ctx,ex+state.eyeLook,eyeY+.2,1.25,1.7,'#203b47');
    }
  }
  if(face==='concern'){
    vikingLine(ctx,[[-8,-5.4],[-3,-6.2]],palette.hair,1.8);
    vikingLine(ctx,[[3,-6.2],[8,-5.4]],palette.hair,1.8);
  }else if(face==='focus'){
    vikingLine(ctx,[[-8,-6],[-3,-5.1]],palette.hair,1.8);
    vikingLine(ctx,[[3,-5.1],[8,-6]],palette.hair,1.8);
  }else{
    vikingLine(ctx,[[-8,-5.7],[-3,-5.9]],palette.hair,1.8);
    vikingLine(ctx,[[3,-5.9],[8,-5.7]],palette.hair,1.8);
  }
  // The mouth sits clear of the moustache so emotion survives downscaling.
  if(face==='alarm')vikingOval(ctx,0,6.8,2.5,3,'#624536');
  else if(face==='smile'){
    ctx.beginPath();ctx.arc(0,4.9,3.5,.12,Math.PI-.12);
    ctx.strokeStyle='#543c32';ctx.lineWidth=1.7;ctx.stroke();
  }else if(face==='concern')vikingLine(ctx,[[-2.7,7],[0,6.3],[2.7,7]],'#694734',1.2);
  else vikingLine(ctx,[[-2.6,6.5],[2.6,6.5]],'#694734',1.1);
  vikingShape(ctx,[[-1.6,-1],[0,-3.5],[2.8,1.7],[1.2,3],[-2.5,2]],'#efbe96',null);
  if(state.species!==1)vikingShape(ctx,[[-.4,2],[-4.3,1.4],[-8,4.7],[-4.1,5.3],[0,3.8],
    [4.3,5.3],[8,4.7],[4.1,1.4]],palette.hair,null);
  vikingLine(ctx,[[0,-1],[.5,1.1]],'#f8d4ac',1.3);

  ctx.save();ctx.translate(0,-4);ctx.rotate(helmet);ctx.translate(0,4);
  // Swept ivory horn ends and an iron nasal ridge read cleanly against ice.
  for(const side of [-1,1]){
    ctx.save();ctx.scale(side,1);
    vikingShape(ctx,[[10,-13],[18,-17],[23,-25],[25,-26],[24,-16],
      [19,-10],[13,-8]],'#d8d0ad','#5d7275',1.05);
    vikingShape(ctx,[[16,-15],[21,-20],[23,-24],[22,-16],[18,-12]],'#f5e9c5',null);
    vikingLine(ctx,[[15,-13],[18,-11]],'#aa9f81',1.3);ctx.restore();
  }
  vikingShape(ctx,[[-14,-6],[-12,-15],[-6,-20],[2,-22],[10,-18],[14,-10],[14,-6]],
    '#63808b','#263f50',1.5);
  vikingShape(ctx,[[-10,-14],[-4,-19],[-1,-19],[-2,-8],[-11,-8]],'#91a8a9',null);
  vikingShape(ctx,[[3,-20],[9,-16],[12,-9],[4,-9]],'#4d6876',null);
  vikingShape(ctx,[[-14.5,-10.5],[14.5,-10.5],[14.5,-6.5],[-14.5,-6.5]],
    '#bdc7b4','#3f5966',1.05);
  vikingShape(ctx,[[-1.8,-20.5],[1.3,-20.5],[2,-3.2],[-1.7,-3.2]],'#d1d7c2','#738a8c',.6);
  for(const rx of [-10,-5,5,10])vikingOval(ctx,rx,-8.5,.75,.75,'#edf0d1');
  ctx.restore();ctx.restore();
}

// Small quadrupeds keep the same gameplay footprint as the human crew. Their
// broad muzzle, ears, four hooves and tiny helmet distinguish them even in ice.
function drawVikingAnimal(ctx,state){
  const {species,pose,t,still,wave,walk,celebration}=state,cow=species===2;
  const fur=cow?'#eee4cc':'#e9a6a0',shade=cow?'#c9c3ac':'#cb827e';
  const active=pose==='celebrate',stride=pose==='walking'?walk:0;
  const bounce=active&&!still?Math.max(0,Math.sin(t*.012+state.seed))*3:0;
  const wiggle=active&&!still?Math.sin(t*.013+state.seed):0;
  // Curly tail or tasselled cow tail, behind the rump.
  ctx.save();ctx.translate(-17,3);ctx.rotate((still?0:wave*.14)+(active?wiggle*.25:0));
  if(cow){vikingLine(ctx,[[0,0],[-6,-2],[-8,5]],'#827967',2);vikingShape(ctx,[[-10,4],[-6,4],[-7,9],[-10,8]],'#655649',null);}
  else{ctx.beginPath();ctx.moveTo(0,0);ctx.bezierCurveTo(-11,-9,-12,6,-6,4);ctx.bezierCurveTo(-2,2,-6,-3,-9,0);ctx.strokeStyle='#aa696b';ctx.lineWidth=2;ctx.stroke();}ctx.restore();
  // Rear legs are darker; lifted front hooves celebrate without changing physics.
  for(const [n,x] of [[0,-12],[1,10],[2,-6],[3,16]]){
    const rear=n<2,step=stride*(n%2?1:-1)*3;
    const kick=active&&celebration===2?Math.max(0,wiggle*(n%2?1:-1))*6:0;
    const lift=active&&(celebration===0||celebration===3)&&n===3?7+bounce:0;
    const bend=pose==='falling'?(n%2?3:-3):step;
    vikingLine(ctx,[[x,8],[x+bend,16-kick-lift],[x+bend*1.4,22-kick-lift]],rear?shade:fur,5);
    vikingShape(ctx,[[x-3+bend*1.4,20-kick-lift],[x+3+bend*1.4,20-kick-lift],[x+4+bend*1.4,25-kick-lift],[x-3+bend*1.4,25-kick-lift]],cow?'#4d4b46':'#785354','#3e4545',.9);
    vikingLine(ctx,[[x+bend*1.4,22-kick-lift],[x+bend*1.4,24-kick-lift]],'#c5bda4',.7);
  }
  // Rounded belly, little teal Viking blanket and a bronze clasp.
  vikingOval(ctx,-1,3,20,13,'#344b4f');vikingOval(ctx,-1,2,19,12,fur);
  if(cow){vikingShape(ctx,[[-16,-5],[-8,-8],[-3,-2],[-6,5],[-14,5]],'#71675b',null);vikingOval(ctx,10,7,5,4,'#75685a');}
  vikingShape(ctx,[[-9,-10],[7,-10],[10,1],[5,9],[-7,7],[-11,0]],cow?'#5b8f8d':'#9277a2','#42616a',1);
  vikingLine(ctx,[[-9,-9],[6,-9],[8,1],[4,6],[-6,5]],'#edce91',1.2);
  vikingOval(ctx,0,-2,2.6,2.6,'#d5ad61');vikingLine(ctx,[[-1,-3],[1,-1]],'#fff0b3',.7);
  // Slight head bob makes the moo / oink, ear wiggle, and happy hops distinct.
  ctx.save();ctx.translate(5,-14-bounce*.35);ctx.rotate(active?wiggle*(cow?.045:.085):state.headTilt);
  for(const side of [-1,1]){
    ctx.save();ctx.scale(side,1);ctx.rotate(active&&!still?wave*.04:0);
    vikingShape(ctx,[[9,-5],[22,-9],[20,1],[13,4]],fur,'#766d66',1);
    vikingShape(ctx,[[13,-4],[19,-6],[17,0]],cow?'#c49690':'#c87782',null);
    ctx.restore();
  }
  vikingOval(ctx,0,-1,14,14,'#42565a');vikingOval(ctx,0,-1,13,13,fur);
  if(cow)vikingShape(ctx,[[-11,-8],[-4,-12],[-1,-5],[-4,3],[-11,2]],'#776b5d',null);
  const blink=!still&&((t+state.seed*157)%4300)>4070;
  const alarm=pose==='falling'||pose==='swim'||pose==='sink';
  for(const side of [-1,1]){
    const x=side*6,y=-3;
    if(blink||pose==='impact')vikingLine(ctx,[[x-2,y],[x+2,y]],'#283f47',1.4);
    else if(active){ctx.beginPath();ctx.arc(x,y+1,2.2,Math.PI+.2,VIKING_TAU-.2);ctx.strokeStyle='#283f47';ctx.lineWidth=1.5;ctx.stroke();}
    else {vikingOval(ctx,x,y,2.6,alarm?3:2.4,'#fff3d9');vikingOval(ctx,x+.5,y+.3,1.3,1.8,'#253e48');}
  }
  const muzzle=cow?'#d6aaa0':'#efb4b0';
  vikingOval(ctx,0,7,cow?11:9,cow?6:6.5,'#a57672');vikingOval(ctx,0,6.1,cow?10.5:8.5,5.8,muzzle);
  for(const side of [-1,1])vikingOval(ctx,side*(cow?5:3.6),5.5,cow?1.3:1.6,cow?1.7:2,'#965f65');
  if(alarm)vikingOval(ctx,0,11,2.4,1.9,'#825559');
  else{ctx.beginPath();ctx.arc(0,8,3,.25,Math.PI-.25);ctx.strokeStyle='#945f60';ctx.lineWidth=1;ctx.stroke();}
  // Stubby horned iron helmet sits between the ears, with a clear nasal band.
  for(const side of [-1,1]){ctx.save();ctx.scale(side,1);vikingShape(ctx,[[8,-13],[14,-15],[17,-22],[19,-22],[18,-13],[12,-9]],'#e9d6a7','#6a7b7e',.9);ctx.restore();}
  vikingShape(ctx,[[-12,-9],[-11,-17],[-5,-22],[4,-22],[11,-17],[12,-9]],'#65848c','#2c4655',1.3);
  vikingShape(ctx,[[-9,-16],[-3,-20],[0,-20],[-1,-11],[-10,-11]],'#a3b8b1',null);
  vikingLine(ctx,[[-12,-10],[12,-10]],'#c9cfb5',3);
  vikingLine(ctx,[[0,-21],[0,-5]],'#dde0c5',2.2);
  for(const x of [-8,8])vikingOval(ctx,x,-10,.8,.8,'#f9ebbc');
  ctx.restore();
  if(active&&celebration===1){ // quick paired hoof clap in front of the blanket
    const clap=still?0:(1+Math.sin(t*.018))*.5;
    for(const side of [-1,1]){
      const x=side*(7-clap*4);vikingLine(ctx,[[side*12,5],[x,-1]],fur,5);vikingOval(ctx,x,-2,3,3,cow?'#4d4b46':'#785354');
    }
  }
}

/** Draw one crew member without retaining state or touching gameplay data. */
function drawAnimatedViking(ctx,options={}) {
  const {x=0,y=0,look=0,angle=0,free=false,scale=1,gait=0,facing=1,
    pose=free?'idle':'frozen',time=0,reducedMotion=false,phase=0}=options;
  if(!ctx||![x,y,angle,scale].every(Number.isFinite)||scale<=0)return;
  const seed=Number.isFinite(look)?Math.floor(look):0;
  const species=((seed%4)+4)%4;
  const celebration=((Math.floor(options.celebration??seed/4)%4)+4)%4;
  const palette=VIKING_PALETTES[species];
  const still=!!reducedMotion,t=Number.isFinite(time)?time:0;
  const p=vikingClamp(Number.isFinite(phase)?phase:0,0,1);
  const wave=still?0:Math.sin(t*.006+seed*.7);
  const walk=still?0:Math.sin(Number.isFinite(gait)&&gait?gait:t*.009+seed);
  const stride=pose==='walking'?walk:0;
  const state={pose,t,still,seed,species,celebration,phase:p,face:free?'smile':'focus',beard:0,
    helmet:0,headTilt:0,eyeLook:0};
  let rootX=0,rootY=0,tilt=0,localScale=1,bodyScaleY=1;
  let left=[[-12,-1],[-15,7],[-14,13]],right=[[12,-1],[16,7],[14,13]];
  let legs=[[[-6,10],[-7,17],[-8,23]],[[6,10],[7,17],[8,23]]];

  if(pose==='frozen'){
    const shiver=still?0:Math.sin(t*.045+seed)*.43*(.35+.65*Math.max(0,Math.sin(t*.0016+seed)));
    rootX=shiver;rootY=still?0:Math.sin(t*.0035+seed)*.25;
    left=[[-12,-1],[-17,6],[-9,3]];right=[[12,-1],[17,6],[9,3]];
    state.face='concern';state.headTilt=shiver*.025;state.eyeLook=wave*.5;
    state.beard=-shiver*.04;
  }else if(pose==='falling'){
    left=[[-12,-1],[-21,-7],[-25,-14+wave*1.6]];
    right=[[12,-1],[21,-10],[25,-18-wave*1.4]];
    legs=[[[-6,10],[-10,16],[-12,22]],[[6,10],[11,15],[13,19]]];
    state.face='alarm';state.beard=-.07+wave*.065;state.helmet=wave*.025;
    state.headTilt=-.025;rootY=still?0:wave*.45;
  }else if(pose==='walking'){
    rootY=still?0:-Math.abs(stride)*1.4;
    tilt=still?0:stride*.018;
    left=[[-12,-1],[-15-stride*1.6,5],[-15-stride*3.6,12-stride*2.7]];
    right=[[12,-1],[15+stride*1.6,5],[15+stride*3.6,12+stride*2.7]];
    legs=[[[-6,10],[-7+stride*2.3,16],[-7+stride*6,22-Math.max(0,-stride)*3]],
      [[6,10],[7-stride*2.3,16],[7-stride*6,22-Math.max(0,stride)*3]]];
    state.face='focus';state.beard=-stride*.06;state.helmet=stride*.012;state.eyeLook=.45;
  }else if(pose==='celebrate'){
    const hop=still?0:Math.pow(Math.max(0,Math.sin(t*.009+seed)),2);
    rootY=-hop*2.4;
    left=[[-12,-1],[-21,-10],[-22,-22]];
    right=[[12,-1],[20,-10],[24.5+wave*.5,-21+wave]];
    legs=[[[-6,10],[-8,16],[-10,22-hop]],[[6,10],[8,16],[10,22-hop]]];
    if(celebration===1){ // delighted clapping
      const clap=still?0:(1+Math.sin(t*.016+seed))*.5;
      left=[[-12,-1],[-14,-7],[-7+clap*5,-9]];right=[[12,-1],[14,-7],[7-clap*5,-9]];rootY=-hop;
    }else if(celebration===2){ // heel-toe dance
      tilt=wave*.065;rootX=wave*1.8;left=[[-12,-1],[-20,-2],[-24,-8-wave*3]];right=[[12,-1],[20,-2],[24,-8+wave*3]];
      legs=[[[-6,10],[-8,16],[-10,22-Math.max(0,wave)*5]],[[6,10],[8,16],[10,22-Math.max(0,-wave)*5]]];
    }else if(celebration===3){ // friendly overhead wave
      left=[[-12,-1],[-17,5],[-12,10]];right=[[12,-1],[18,-13],[22+wave*3,-25]];rootY=-hop*.7;
    }
    state.face='smile';state.headTilt=wave*.025;state.beard=wave*.045;state.helmet=-wave*.015;
  }else if(pose==='impact'||pose==='rise'){
    // A compact, side-on landing preserves the physical center and footprint.
    const prone=pose==='impact'?vikingSmooth(Math.min(1,p*3.5)):1-vikingSmooth(p);
    tilt=-Math.PI*.48*prone;
    localScale=Math.min(1-.25*prone,29/(28*Math.abs(Math.cos(tilt))+36*Math.abs(Math.sin(tilt))));
    rootY=6*prone;bodyScaleY=1-(pose==='impact'?.16*(1-prone):.06*prone);
    left=[[-12,-1],[-20,5],[-23,11]];
    right=[[12,-1],[20,4],[22,12]];
    legs=[[[-6,10],[-12,17],[-13,21]],[[6,10],[12,13],[15,20]]];
    if(pose==='rise'){
      left=[[-12,-1],[-18,8],[-20,18-prone*6]];
      right=[[12,-1],[18,6],[13,12]];
    }
    state.face=pose==='impact'?'alarm':'focus';state.beard=.12*prone;state.helmet=-.035*prone;
    state.headTilt=.07*prone;
  }else if(pose==='swim'||pose==='sink'){
    const flail=still?0:Math.sin(t*.014+seed);
    rootY=3+(still?0:wave*1.2)+(pose==='sink'?p*46:0);
    left=[[-12,-1],[-21,-5-flail*3],[-25,-12-flail*7]];
    right=[[12,-1],[21,-5+flail*3],[25,-12+flail*7]];
    if(pose==='sink'){
      left=[[-12,-1],[-20,-13],[-20,-26]];
      right=[[12,-1],[20,-14],[23,-25+flail*2]];
    }
    state.face='alarm';state.headTilt=flail*.035;state.beard=flail*.055;
  }else{
    // Captain/deck idle: a quiet breath, hand on belt and occasional glance.
    rootY=still?0:Math.sin(t*.0026+seed)*.35-.15;
    right=[[12,-1],[17,6],[10,10]];
    state.face=free?'smile':'focus';state.eyeLook=wave*.35;
    state.beard=still?0:Math.sin(t*.0026+seed-.5)*.015;
  }

  ctx.save();
  try{
    ctx.translate(x,y);ctx.rotate(angle);ctx.scale(scale*(facing<0?-1:1),scale);
    ctx.lineCap='round';ctx.lineJoin='round';
    if(pose==='swim'||pose==='sink'){
      ctx.beginPath();ctx.rect(-31,-42,62,49);ctx.clip();
    }else if(pose!=='falling'){
      vikingOval(ctx,0,24.5,pose==='impact'?22:17.5,2.3,'#16354a30');
    }
    ctx.translate(rootX,rootY);ctx.rotate(tilt);ctx.scale(localScale,localScale);
    if(species>=2){drawVikingAnimal(ctx,{...state,palette,wave,walk,bodyScaleY});return;}
    vikingLeg(ctx,...legs[0],false);vikingLeg(ctx,...legs[1],true);
    ctx.save();ctx.scale(1,bodyScaleY);
    if(pose==='celebrate'&&celebration===0)vikingAxe(ctx,right[2],wave);
    vikingLimb(ctx,...left,palette,false);
    vikingLimb(ctx,...right,palette,true);

function focusWorld(x,y){camera.x=x-W/camera.zoom/2;camera.y=y-H/camera.zoom/2;clampCamera();}

function drawWaterLoss(t){if(!waterLoss)return;const age=t-waterLoss.startedAt,phase=Math.max(0,Math.min(1,(age-850)/1000));drawViking(waterLoss.x,waterLoss.y-7,waterLoss.look,0,true,1,0,1,{pose:age<850?'swim':'sink',phase:age<850?age/850:phase});ctx.save();for(let i=0;i<7;i++){const life=((age+i*160)%1100)/1100;if(age>450){ctx.globalAlpha=(1-life)*.65;ctx.strokeStyle='#bfeefa';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(waterLoss.x+Math.sin(i*3)*17,waterLoss.y+24-life*44,2+i%3,0,Math.PI*2);ctx.stroke();}}ctx.globalAlpha=.5;for(let i=0;i<2;i++){ctx.beginPath();ctx.ellipse(waterLoss.x,waterLoss.y+2,17+(age*.025+i*12)%39,3+(age*.002)%4,0,0,Math.PI*2);ctx.strokeStyle='#c5f2f5';ctx.stroke();}ctx.restore();}
function drawMinimap(){if(!started)return;const m=miniBounds(),sx=m.w/sim.world.width,sy=m.h/sim.world.height;ctx.save();ctx.fillStyle='#0d2a3dea';ctx.strokeStyle='#94bab888';ctx.lineWidth=1;ctx.beginPath();ctx.roundRect(m.x,m.y,m.w,m.h,5);ctx.fill();ctx.stroke();ctx.beginPath();ctx.rect(m.x,m.y,m.w,m.h);ctx.clip();ctx.translate(m.x,m.y);ctx.scale(sx,sy);for(const r of sim.rocks)path(r.vertices,'#71929c');for(const i of sim.ice)path(i.body.vertices,i.kind==='pack'?'#71c2ef':'#b6f2ee');for(const v of sim.getVikings())ellipse(v.x,v.y,12,12,'#f1d399');ctx.fillStyle='#eab778';ctx.fillRect(sim.level.boat.x-sim.level.boat.width/2,sim.level.boat.y,sim.level.boat.width,22);ctx.strokeStyle='#ffedb6';ctx.lineWidth=2/sx;ctx.strokeRect(camera.x,camera.y,W/camera.zoom,H/camera.zoom);ctx.restore();}
function render(t){ctx.clearRect(0,0,W,H);ctx.save();ctx.scale(W/960,H/640);background(t);drawVillage(ctx,{time:t,reducedMotion,cameraX:camera.x,cameraY:camera.y,chapter:sim?.level.chapter||0});if(!started){ctx.restore();ctx.save();const heroScale=W/960;ctx.translate(0,(H-640*heroScale)*(W<800?.78:.58));ctx.scale(heroScale,heroScale);drawTitleScene(t);ctx.restore();return;}ctx.restore();ctx.save();ctx.scale(camera.zoom,camera.zoom);ctx.translate(-camera.x,-camera.y);drawWorldWater(t);const ship=boatArt(t);drawLongshipBack(ctx,ship);for(const rock of sim.rocks)drawRock(rock);for(const timber of sim.timbers)drawTimber(timber);for(const s of sim.level.spikes||[])drawSpikes(s);for(const r of sim.runes)drawRune(r,t);for(const ice of sim.ice)drawRopes(ice);for(const ice of sim.ice){ctx.save();if(waterLoss?.sourceBody===ice.body.id){ctx.beginPath();ctx.rect(-1000,-1000,sim.world.width+2000,waterLoss.y+1000);ctx.clip();ctx.translate(0,Math.max(0,t-waterLoss.startedAt)*.2);}drawIce(ice,t);ctx.restore();}drawWalkers(t);drawLongshipCrew(ctx,ship);drawLongshipFront(ctx,ship);drawWaterLoss(t);drawGuide(t);
 if(sim.level.wind){ctx.save();ctx.fillStyle='#e9eee0aa';ctx.font='12px Trebuchet MS';ctx.textAlign='left';ctx.fillText(sim.level.wind>0?'〰 →':'← 〰',29,34);ctx.restore();}
 for(const p of particles){ctx.globalAlpha=p.life;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.life*(p.spin||4));path(p.shard?[[-p.size,-p.size*.4],[p.size*.7,-p.size*.6],[p.size*.25,p.size]]:[[-p.size,0],[0,-p.size],[p.size,0],[0,p.size]],p.color);ctx.restore();}ctx.globalAlpha=1;for(const s of trails){ctx.globalAlpha=s.life;line([[s.a.x,s.a.y],[s.b.x,s.b.y]],'#e5ffff',2+s.life*2);}ctx.globalAlpha=1;
 if(drag){const preview=sim.inspectSlice(drag.a,drag.b),color=preview.ok?'#a9ffe0':preview.reason==='viking'?'#ff969b':'#fff2c9';canvas.dataset.cutPreview=preview.ok?'valid':preview.reason;ctx.save();ctx.lineJoin='round';for(const candidate of preview.candidates){ctx.globalAlpha=.12;path(candidate.ice.body.vertices,color);ctx.globalAlpha=.75;path(candidate.ice.body.vertices,null,color,1.5);}ctx.globalAlpha=1;if(preview.blocked){ctx.beginPath();ctx.arc(preview.blocked.x,preview.blocked.y,27,0,Math.PI*2);ctx.strokeStyle=color;ctx.lineWidth=2;ctx.stroke();}for(const rope of preview.ropes){ellipse(rope.hit.x,rope.hit.y,8,8,'#a9ffe033');ellipse(rope.hit.x,rope.hit.y,3,3,color);}ctx.shadowColor=color;ctx.shadowBlur=12;if(!preview.ok)ctx.setLineDash([7,5]);line([[drag.a.x,drag.a.y],[drag.b.x,drag.b.y]],color,2.8);ctx.setLineDash([]);ellipse(drag.a.x,drag.a.y,4,4,color);ellipse(drag.b.x,drag.b.y,7,7,'#123644');ctx.strokeStyle=color;ctx.lineWidth=2;ctx.stroke();ctx.font='bold 11px Trebuchet MS';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle=color;ctx.fillText(preview.ok?'✓':preview.reason==='viking'?'×':'·',drag.b.x,drag.b.y);ctx.restore();}else delete canvas.dataset.cutPreview;
 ctx.restore();drawMinimap();if(paused){ctx.save();ctx.fillStyle='#102d3ee8';ctx.beginPath();ctx.roundRect(15,15,145,39,9);ctx.fill();ctx.strokeStyle='#b7e9df88';ctx.lineWidth=1;ctx.stroke();ctx.fillStyle='#f5f1db';ctx.textAlign='center';ctx.font='15px Trebuchet MS';ctx.fillText('Ⅱ  Paused',87.5,40);ctx.restore();}
}
function frame(t){const dt=Math.min(t-lastFrame||16.67,50);lastFrame=t;clock=t;if(cameraTween){const p=Math.min(1,(t-cameraTween.startedAt)/(reducedMotion?1:420)),ease=p*p*(3-2*p);for(const k of ['x','y','zoom'])camera[k]=cameraTween.initial[k]+(cameraTween.target[k]-cameraTween.initial[k])*ease;if(p>=1)cameraTween=null;}if(started&&!paused&&!modalOpen){accumulator+=dt;while(accumulator>=1000/60){sim.step(1000/60);accumulator-=1000/60;}}else accumulator=0;for(const p of particles){p.x+=p.vx*dt/16.67;p.y+=p.vy*dt/16.67;p.vy+=.06*dt/16.67;p.life-=dt/800;}particles=particles.filter(p=>p.life>0);for(const s of trails)s.life-=dt/420;trails=trails.filter(s=>s.life>0);render(t);requestAnimationFrame(frame);}
document.body.classList.add('is-splash');resizeCanvas();setSound();loadLevel(0);requestAnimationFrame(frame);
if(new URLSearchParams(location.search).has('test'))window.__frostyChamps={get seed(){return currentSeed;},newMap,get sim(){return sim;},get started(){return started;},get index(){return index;},get camera(){return {...camera,width:W,height:H};},get panMode(){return panMode;},get arrivals(){return sim.rescued.map(v=>arrivalPresentation(v,clock));},get waterLoss(){return waterLoss?{...waterLoss,age:clock-waterLoss.startedAt}:null;},get paused(){return paused;},get level(){return currentLevel;},loadLevel:n=>{if(!started)start();loadLevel(n);},slice:(a,b)=>{const r=paused?{ok:false,reason:'paused'}:sim.slice(a,b);updateUI();return r;},step:n=>{for(let i=0;i<n;i++)sim.step(1000/60);updateUI();},showMap,closeModal,LEVELS};
